version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: yolaab
      MYSQL_USER: yolaab_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./Backend
    environment:
      - DATABASE_URL=mysql://yolaab_user:password@db:3306/yolaab
    depends_on:
      - db
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./Frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  db_data:
